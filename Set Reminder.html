<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Reminder | Smart Medicine Reminder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #f6fbff;
            color: #183b56;
        }

        .navbar {
            background: white;
            box-shadow: 0 5px 25px rgba(0, 105, 170, 0.08);
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #087fda !important;
        }

        .nav-link {
            font-weight: 500;
            color: #35576e !important;
        }

        .page {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: 60px 0;
        }

        .reminder-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 85, 140, 0.10);
            max-width: 650px;
            margin: auto;
        }

        .icon-box {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #e5f6ff;
            color: #087fda;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-weight: 700;
            color: #103b5b;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-main {
            background: linear-gradient(135deg, #087fda, #14a7e8);
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-main:hover {
            color: white;
            transform: translateY(-2px);
        }

        .success-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #ddf8e9;
            color: #18854a;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-capsule"></i>
                Smart Medicine Reminder
            </a>

            <div>
                <a href="index.html" class="btn btn-outline-primary me-2">
                    Home
                </a>

                <a href="Add Medicine.html" class="btn btn-primary">
                    My Medicines
                </a>
            </div>

        </div>
    </nav>


    <!-- Set Reminder -->
    <section class="page">

        <div class="container">

            <div class="reminder-card">

                <div class="icon-box">
                    <i class="bi bi-alarm-fill"></i>
                </div>

                <h1 class="text-center mb-2">
                    Set Medicine Reminder
                </h1>

                <p class="text-center text-muted mb-4">
                    Set a reminder for your medicine dose.
                </p>


                <form id="reminderForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Medicine Name
                        </label>

                        <input
                            type="text"
                            id="medicineName"
                            class="form-control"
                            placeholder="Enter medicine name"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Dosage
                        </label>

                        <input
                            type="text"
                            id="dosage"
                            class="form-control"
                            placeholder="Example: 1 Tablet"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Reminder Time
                        </label>

                        <input
                            type="time"
                            id="reminderTime"
                            class="form-control"
                            required
                        >
                    </div>


                    <div class="mb-4">
                        <label class="form-label">
                            Reminder Note
                        </label>

                        <textarea
                            id="note"
                            class="form-control"
                            rows="3"
                            placeholder="Example: Take after food"
                        ></textarea>
                    </div>


                    <button type="submit" class="btn btn-main w-100">
                        <i class="bi bi-bell-fill me-2"></i>
                        Set Reminder
                    </button>

                </form>


                <div id="successBox" class="success-box">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    Reminder saved successfully!
                </div>
<div class="mt-4">
    <h4 class="mb-3">Saved Reminders</h4>

    <div id="remindersList"></div>
</div>
            </div>

        </div>

    </section>


    <script>
        document
            .getElementById("reminderForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const medicineName =
                    document.getElementById("medicineName").value;

                const dosage =
                    document.getElementById("dosage").value;

                const reminderTime =
                    document.getElementById("reminderTime").value;

                const note =
                    document.getElementById("note").value; 
                    
const reminder = {
    medicineName: medicineName,
    dosage: dosage,
    reminderTime: reminderTime,
    note: note,
    status: "scheduled"
};
let reminders =
    JSON.parse(localStorage.getItem("reminders")) || [];

reminders.push(reminder);

localStorage.setItem(
    "reminders",
    JSON.stringify(reminders)
);
                document.getElementById("successBox").style.display = "block";

                document.getElementById("reminderForm").reset();
               
            });
            // Load saved reminders

const savedMedicines =
    JSON.parse(localStorage.getItem("medicines")) || [];

const lastMedicine =
    savedMedicines[savedMedicines.length - 1];

if (lastMedicine) {
    document.getElementById("medicineName").value =
        lastMedicine.name;

    document.getElementById("dosage").value =
        lastMedicine.dose;
}
const savedReminders =
    JSON.parse(localStorage.getItem("reminders")) || [];

console.log("Saved reminders:", savedReminders);
const remindersList = document.getElementById("remindersList");

savedReminders.forEach((reminder) => {

    const reminderCard = document.createElement("div");

    reminderCard.className = "border rounded p-3 mb-2";

    reminderCard.innerHTML = `
        <strong>${reminder.medicineName}</strong><br>
        Dosage: ${reminder.dosage}<br>
        Time: ${reminder.reminderTime}<br>
        Note: ${reminder.note || "No note"}
    `;

    remindersList.appendChild(reminderCard);
});
    </script>

</body>
</html>
