<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Reminder | Smart MediTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #f6fbff;
            color: #183b56;
        }

        .navbar {
            background: white;
            box-shadow: 0 5px 25px rgba(0, 105, 170, 0.08);
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #087fda !important;
        }

        .page {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: 60px 0;
        }

        .reminder-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 85, 140, 0.10);
            max-width: 650px;
            margin: auto;
        }

        .icon-box {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #e5f6ff;
            color: #087fda;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-weight: 700;
            color: #103b5b;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-main {
            background: linear-gradient(135deg, #087fda, #14a7e8);
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-main:hover {
            color: white;
            transform: translateY(-2px);
        }

        .success-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #ddf8e9;
            color: #18854a;
            font-weight: 600;
        }

        .alarm-box {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(10, 25, 40, 0.88);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .alarm-box.active {
            display: flex;
        }

        .alarm-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
        }

        .alarm-icon {
            font-size: 4rem;
            color: #e63946;
            animation: alarmPulse 1s infinite;
        }

        @keyframes alarmPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .btn-stop {
            background: #e63946;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-weight: 600;
        }

        .btn-stop:hover {
            background: #c92a36;
            color: white;
        }

        .btn-snooze {
            background: #087fda;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-weight: 600;
        }

        .btn-snooze:hover {
            background: #0668b2;
            color: white;
        }

        @media (max-width: 576px) {
            .reminder-card {
                padding: 25px;
            }

            .navbar .container {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-capsule"></i>
                Smart Medicine Reminder
            </a>

            <div>
                <a href="index.html" class="btn btn-outline-primary me-2">
                    Home
                </a>

                <a href="Add Medicine.html" class="btn btn-primary">
                    My Medicines
                </a>
            </div>

        </div>
    </nav>


    <!-- Set Reminder -->
    <section class="page">
        <div class="container">
            <div class="reminder-card">

                <div class="icon-box">
                    <i class="bi bi-alarm-fill"></i>
                </div>

                <h1 class="text-center mb-2">
                    Set Medicine Reminder
                </h1>

                <p class="text-center text-muted mb-4">
                    Set a reminder for your medicine dose.
                </p>

                <form id="reminderForm">

                    <div class="mb-3">
                        <label for="medicineName" class="form-label">
                            Medicine Name
                        </label>

                        <input
                            type="text"
                            id="medicineName"
                            class="form-control"
                            placeholder="Enter medicine name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="dosage" class="form-label">
                            Dosage
                        </label>

                        <input
                            type="text"
                            id="dosage"
                            class="form-control"
                            placeholder="Example: 1 Tablet"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="reminderTime" class="form-label">
                            Reminder Time
                        </label>

                        <input
                            type="time"
                            id="reminderTime"
                            class="form-control"
                            required
                        >
                    </div>
                     <div class="mb-3">
    <label for="frequency" class="form-label">
        Reminder Frequency
    </label>

    <select id="frequency" class="form-select" required>
        <option value="daily">Everyday</option>
        <option value="one-time">One Time</option>
    </select>
</div>
                    <div class="mb-4">
                        <label for="note" class="form-label">
                            Reminder Note
                        </label>

                        <textarea
                            id="note"
                            class="form-control"
                            rows="3"
                            placeholder="Example: Take after food"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-main w-100">
                        <i class="bi bi-bell-fill me-2"></i>
                        Set Reminder
                    </button>

                </form>

                <div id="successBox" class="success-box">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    Reminder saved successfully!
                </div>

                <div class="mt-4">
                    <h4 class="mb-3">Saved Reminders</h4>
                    <div id="remindersList"></div>
                </div>

            </div>
        </div>
    </section>


    <!-- Alarm Popup -->
    <div id="alarmBox" class="alarm-box" role="alertdialog" aria-modal="true">

        <div class="alarm-card">

            <div class="alarm-icon">
                <i class="bi bi-alarm-fill"></i>
            </div>

            <h2 class="mt-3">Medicine Reminder!</h2>

            <h4 id="alarmMedicineName" class="text-primary"></h4>

            <p id="alarmDosage" class="mb-2"></p>

            <p id="alarmNote" class="text-muted"></p>

            <div class="d-grid gap-2 mt-4">

                <button id="stopAlarmBtn" class="btn-stop">
                    <i class="bi bi-stop-circle-fill me-2"></i>
                    Stop Alarm
                </button>

                <button id="snoozeAlarmBtn" class="btn-snooze">
                    <i class="bi bi-clock-history me-2"></i>
                    Snooze 5 Minutes
                </button>

            </div>

        </div>

    </div>


    <!-- Alarm audio file must be in the same folder as this HTML file -->
    <audio
        id="alarmAudio"
        src="smartmeditrack_alarm.wav"
        loop
        preload="auto"
    ></audio>


    <script>
        // ===============================
        // ALARM VARIABLES
        // ===============================

        const alarmAudio = document.getElementById("alarmAudio");
        const alarmBox = document.getElementById("alarmBox");

        let activeReminder = null;
        let activeReminderKey = null;
        let alarmStopped = false;
        let snoozeTimeout = null;

        const triggeredReminders = new Set();


        // ===============================
        // REQUEST NOTIFICATION PERMISSION
        // ===============================

        async function requestNotificationPermission() {

            if ("Notification" in window) {

                if (Notification.permission === "default") {
                    try {
                        await Notification.requestPermission();
                    } catch (error) {
                        console.log("Notification permission unavailable.");
                    }
                }

            }

        }


        // ===============================
        // SET REMINDER
        // ===============================

        document
            .getElementById("reminderForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                await requestNotificationPermission();

                const medicineName =
                    document.getElementById("medicineName").value.trim();

                const dosage =
                    document.getElementById("dosage").value.trim();

                const reminderTime =
                    document.getElementById("reminderTime").value;

                const note =
                    document.getElementById("note").value.trim();


                const reminder = {
                    medicineName: medicineName,
                    dosage: dosage,
                    reminderTime: reminderTime,
                    note: note,
                    status: "scheduled"
                };


                let reminders =
                    JSON.parse(localStorage.getItem("reminders")) || [];

                reminders.push(reminder);

                localStorage.setItem(
                    "reminders",
                    JSON.stringify(reminders)
                );


                document.getElementById("successBox").style.display = "block";

                document.getElementById("reminderForm").reset();

                setTimeout(function() {
                    document.getElementById("successBox").style.display = "none";
                }, 3000);

                displayReminders();

            });


        // ===============================
        // DISPLAY SAVED REMINDERS
        // ===============================

        function displayReminders() {

            const remindersList =
                document.getElementById("remindersList");

            remindersList.innerHTML = "";

            const savedReminders =
                JSON.parse(localStorage.getItem("reminders")) || [];


            savedReminders.slice().reverse().forEach((reminder) => {

                const reminderCard = document.createElement("div");

                reminderCard.className = "border rounded p-3 mb-2";

                const medicineTitle = document.createElement("strong");
                medicineTitle.textContent = reminder.medicineName;

                const dosageText = document.createElement("div");
                dosageText.textContent = "Dosage: " + reminder.dosage;

                const timeText = document.createElement("div");
                timeText.textContent = "Time: " + reminder.reminderTime;

                const noteText = document.createElement("div");
                noteText.textContent = "Note: " + (reminder.note || "No note");

                reminderCard.appendChild(medicineTitle);
                reminderCard.appendChild(dosageText);
                reminderCard.appendChild(timeText);
                reminderCard.appendChild(noteText);

                remindersList.appendChild(reminderCard);

            });

        }


        // ===============================
        // START ALARM
        // ===============================

        async function startAlarm(reminder, reminderKey) {

            // Don't interrupt an alarm already playing
            if (activeReminder) {
                return;
            }

            activeReminder = reminder;
            activeReminderKey = reminderKey;
            alarmStopped = false;

            document.getElementById("alarmMedicineName").textContent =
                reminder.medicineName;

            document.getElementById("alarmDosage").textContent =
                "Dosage: " + reminder.dosage;

            document.getElementById("alarmNote").textContent =
                reminder.note ? "Note: " + reminder.note : "";

            alarmBox.classList.add("active");


            // Show browser notification
            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                try {
                    new Notification("💊 Smart MediTrack", {
                        body:
                            "Time to take " + reminder.medicineName +
                            "\nDosage: " + reminder.dosage
                    });
                } catch (error) {
                    console.log("Notification could not be displayed.");
                }

            }


            // Play looping audio
            try {

                alarmAudio.currentTime = 0;
                await alarmAudio.play();

            } catch (error) {

                console.warn(
                    "Alarm audio could not play. Check the audio file and browser permissions.",
                    error
                );

            }

        }


        // ===============================
        // STOP ALARM
        // ===============================

        function stopAlarm() {

            alarmAudio.pause();
            alarmAudio.currentTime = 0;

            alarmBox.classList.remove("active");

            if (activeReminderKey) {
                triggeredReminders.add(activeReminderKey);
            }

            activeReminder = null;
            activeReminderKey = null;
            alarmStopped = true;

            if (snoozeTimeout) {
                clearTimeout(snoozeTimeout);
                snoozeTimeout = null;
            }

        }


        document
            .getElementById("stopAlarmBtn")
            .addEventListener("click", stopAlarm);


        // ===============================
        // SNOOZE ALARM FOR 5 MINUTES
        // ===============================

        document
            .getElementById("snoozeAlarmBtn")
            .addEventListener("click", function() {

                if (!activeReminder) {
                    return;
                }

                const reminderToSnooze = activeReminder;
                const reminderKeyToSnooze = activeReminderKey;

                alarmAudio.pause();
                alarmAudio.currentTime = 0;

                alarmBox.classList.remove("active");

                activeReminder = null;
                activeReminderKey = null;

                if (snoozeTimeout) {
                    clearTimeout(snoozeTimeout);
                }

                snoozeTimeout = setTimeout(function() {

                    snoozeTimeout = null;

                    startAlarm(
                        reminderToSnooze,
                        reminderKeyToSnooze + "_snooze_" + Date.now()
                    );

                }, 5 * 60 * 1000);

            });


        // ===============================
        // CHECK REMINDERS EVERY SECOND
        // ===============================

        function checkReminders() {

            // Avoid triggering reminders when the page is hidden
            if (document.hidden) {
                return;
            }

            // Do not trigger another alarm while one is active
            if (activeReminder) {
                return;
            }

            const reminders =
                JSON.parse(localStorage.getItem("reminders")) || [];

            const now = new Date();

            const hours =
                String(now.getHours()).padStart(2, "0");

            const minutes =
                String(now.getMinutes()).padStart(2, "0");

            const currentTime = `${hours}:${minutes}`;

            const today =
                `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;


            reminders.forEach((reminder, index) => {

                if (
                    reminder.status !== "scheduled" ||
                    reminder.reminderTime !== currentTime
                ) {
                    return;
                }

                const reminderKey =
                    `medicineReminder_${today}_${index}_${reminder.reminderTime}`;

                // Prevent duplicate alarms during the same page session
                if (triggeredReminders.has(reminderKey)) {
                    return;
                }

                // Prevent duplicate alarms after page reload
                if (localStorage.getItem(reminderKey)) {
                    triggeredReminders.add(reminderKey);
                    return;
                }

                localStorage.setItem(reminderKey, "true");

                triggeredReminders.add(reminderKey);

                startAlarm(reminder, reminderKey);

            });

        }


        // ===============================
        // LOAD LAST MEDICINE
        // ===============================

        const savedMedicines =
            JSON.parse(localStorage.getItem("medicines")) || [];

        const lastMedicine =
            savedMedicines[savedMedicines.length - 1];

        if (lastMedicine) {

            document.getElementById("medicineName").value =
                lastMedicine.name || "";

            document.getElementById("dosage").value =
                lastMedicine.dose || "";

        }


        // ===============================
        // INITIALIZE
        // ===============================

        displayReminders();

        checkReminders();

        setInterval(checkReminders, 1000);

    </script>

</body>
</html>
