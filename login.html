<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Medicine Reminder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;

            background: linear-gradient(
                135deg,
                #eef7ff,
                #f8fbff
            );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 70px;
            height: 70px;

            background: #0d6efd;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            font-size: 30px;
        }

        .title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus {
            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: none;

            color: #777;

            cursor: pointer;
        }

        .login-btn {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 13px;

            background: #0d6efd;
            color: white;

            font-weight: 600;

            margin-top: 10px;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-text a {
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            display: none;

            border-radius: 10px;

            padding: 12px;

            margin-bottom: 20px;

            text-align: center;
        }

        .success-message {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- Logo -->

    <div class="logo">

        <i class="bi bi-capsule-pill"></i>

    </div>


    <!-- Title -->

    <h2 class="title">
        Welcome Back
    </h2>


    <p class="subtitle">
        Login to your Smart Medicine Reminder
    </p>


    <!-- Success Message -->

    <div
        id="successMessage"
        class="message success-message"
    >
        Login successful!
    </div>


    <!-- Error Message -->

    <div
        id="errorMessage"
        class="message error-message"
    ></div>


    <!-- Login Form -->

    <form id="loginForm">


        <!-- Email -->

        <div class="mb-3">

            <label
                for="email"
                class="form-label"
            >
                Email Address
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- Password -->

        <div class="mb-3">

            <label
                for="password"
                class="form-label"
            >
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()"
                >

                    <i
                        id="passwordIcon"
                        class="bi bi-eye"
                    ></i>

                </button>

            </div>

        </div>


        <!-- Remember Me -->

        <div class="form-check mb-3">

            <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
            >

            <label
                class="form-check-label"
                for="rememberMe"
            >
                Remember me
            </label>

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="login-btn"
        >

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login

        </button>


    </form>


    <!-- Register -->

    <div class="register-text">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


</div>



<script>


    // ================================
    // LOAD REMEMBERED EMAIL
    // ================================

    const rememberedEmail =
        localStorage.getItem("rememberedEmail");


    if (rememberedEmail) {

        document.getElementById("email").value =
            rememberedEmail;

        document.getElementById("rememberMe").checked =
            true;
    }



    // ================================
    // SHOW / HIDE PASSWORD
    // ================================

    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("passwordIcon");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }



    // ================================
    // LOGIN
    // ================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {


        event.preventDefault();


        // Get values

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const rememberMe =
            document
                .getElementById("rememberMe")
                .checked;


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        // Hide old messages

        successMessage.style.display = "none";

        errorMessage.style.display = "none";



        // ================================
        // VALIDATE EMAIL
        // ================================

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            errorMessage.innerText =
                "Please enter a valid email address.";

            errorMessage.style.display =
                "block";

            return;
        }



        // ================================
        // GET ACCOUNTS
        // ================================

        const accounts =
            JSON.parse(
                localStorage.getItem("accounts")
            ) || [];



        // ================================
        // FIND ACCOUNT
        // ================================

        const account =
            accounts.find(function(user) {

                return (
                    user.email &&
                    user.email.toLowerCase() === email &&
                    user.password === password
                );

            });



        // ================================
        // WRONG LOGIN
        // ================================

        if (!account) {

            errorMessage.innerText =
                "Incorrect email or password.";

            errorMessage.style.display =
                "block";

            return;
        }



        // ================================
        // LOGIN SUCCESS
        // ================================

        localStorage.setItem(
            "loggedIn",
            "true"
        );


        // Save current user

        localStorage.setItem(
            "currentUser",
            JSON.stringify(account)
        );



        // ================================
        // REMEMBER EMAIL
        // ================================

        if (rememberMe) {

            localStorage.setItem(
                "rememberedEmail",
                email
            );

        } else {

            localStorage.removeItem(
                "rememberedEmail"
            );

        }



        // ================================
        // SUCCESS MESSAGE
        // ================================

        successMessage.innerText =
            "Login successful! Redirecting...";

        successMessage.style.display =
            "block";



        // ================================
        // GO TO DASHBOARD
        // ================================

        setTimeout(function() {

            window.location.href =
                "Dashboard.html";

        }, 1000);


    });

</script>


</body>

</html>
