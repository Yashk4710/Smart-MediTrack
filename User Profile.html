<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Profile - Smart Medicine Reminder</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            background: #f5f8fc;

            color: #222;
        }


        /* Navbar */

        .navbar {

            background: white;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.08);
        }


        .navbar-brand {

            font-weight: 700;

            color: #0d6efd !important;
        }


        .nav-link {

            color: #555 !important;

            font-weight: 500;
        }


        .nav-link:hover {

            color: #0d6efd !important;
        }


        /* Main */

        .profile-container {

            max-width: 900px;

            margin: 50px auto;

            padding: 0 20px;
        }


        .profile-card {

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);
        }


        /* Profile Avatar */

        .profile-avatar {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            background: #0d6efd;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

            font-size: 45px;

            font-weight: 600;
        }


        .profile-title {

            text-align: center;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .profile-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 35px;
        }


        /* Information */

        .info-box {

            background: #f8f9fa;

            border-radius: 12px;

            padding: 16px 18px;

            margin-bottom: 15px;

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .info-icon {

            width: 45px;

            height: 45px;

            border-radius: 10px;

            background: #e7f1ff;

            color: #0d6efd;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            flex-shrink: 0;
        }


        .info-label {

            font-size: 13px;

            color: #777;

            margin-bottom: 3px;
        }


        .info-value {

            font-weight: 600;

            word-break: break-word;
        }


        /* Buttons */

        .button-row {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }


        .profile-btn {

            flex: 1;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            border: none;
        }


        .dashboard-btn {

            background: #0d6efd;

            color: white;
        }


        .dashboard-btn:hover {

            background: #0b5ed7;
        }


        .logout-btn {

            background: #dc3545;

            color: white;
        }


        .logout-btn:hover {

            background: #bb2d3b;
        }


        .message {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;
        }


        .success-message {

            background: #d1e7dd;

            color: #0f5132;
        }


        .error-message {

            background: #f8d7da;

            color: #842029;
        }


        /* Mobile */

        @media (max-width: 576px) {

            .profile-card {

                padding: 25px 20px;
            }


            .button-row {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="Dashboard.html"
        >

            <i class="bi bi-capsule-pill me-2"></i>

            Smart Medicine Reminder

        </a>


        <div class="ms-auto">

            <a
                href="Dashboard.html"
                class="nav-link d-inline-block"
            >

                <i class="bi bi-speedometer2 me-1"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<!-- PROFILE -->

<div class="profile-container">

    <div class="profile-card">


        <!-- Avatar -->

        <div
            id="profileAvatar"
            class="profile-avatar"
        >

            👤

        </div>


        <h2
            id="profileNameHeading"
            class="profile-title"
        >

            User Profile

        </h2>


        <p class="profile-subtitle">

            Your account information

        </p>



        <!-- Name -->

        <div class="info-box">

            <div class="info-icon">

                <i class="bi bi-person-fill"></i>

            </div>


            <div>

                <div class="info-label">
                    Full Name
                </div>

                <div
                    id="profileName"
                    class="info-value"
                >
                    Loading...
                </div>

            </div>

        </div>



        <!-- Email -->

        <div class="info-box">

            <div class="info-icon">

                <i class="bi bi-envelope-fill"></i>

            </div>


            <div>

                <div class="info-label">
                    Email Address
                </div>

                <div
                    id="profileEmail"
                    class="info-value"
                >
                    Loading...
                </div>

            </div>

        </div>



        <!-- Phone -->

        <div class="info-box">

            <div class="info-icon">

                <i class="bi bi-telephone-fill"></i>

            </div>


            <div>

                <div class="info-label">
                    Phone Number
                </div>

                <div
                    id="profilePhone"
                    class="info-value"
                >
                    Loading...
                </div>

            </div>

        </div>



        <!-- Buttons -->

        <div class="button-row">


            <button
                class="profile-btn dashboard-btn"
                onclick="goToDashboard()"
            >

                <i class="bi bi-speedometer2 me-2"></i>

                Dashboard

            </button>


            <button
                class="profile-btn logout-btn"
                onclick="logout()"
            >

                <i class="bi bi-box-arrow-right me-2"></i>

                Logout

            </button>


        </div>



        <div
            id="message"
            class="message"
        ></div>


    </div>

</div>



<script>


    // Load current logged-in user

    function loadProfile() {


        const currentUser =
            JSON.parse(
                localStorage.getItem("currentUser")
            );


        // If no user is logged in

        if (!currentUser) {

            document.getElementById("profileName")
                .innerText = "Not logged in";

            document.getElementById("profileEmail")
                .innerText = "-";

            document.getElementById("profilePhone")
                .innerText = "-";

            document.getElementById("profileNameHeading")
                .innerText = "User Profile";

            return;
        }



        // Display name

        document.getElementById("profileName")
            .innerText =
                currentUser.name || "Not available";



        // Display email

        document.getElementById("profileEmail")
            .innerText =
                currentUser.email || "Not available";



        // Display phone

        document.getElementById("profilePhone")
            .innerText =
                currentUser.phone || "Not available";



        // Display name in heading

        document.getElementById("profileNameHeading")
            .innerText =
                currentUser.name || "User Profile";



        // Create avatar initials

        if (currentUser.name) {


            const nameParts =
                currentUser.name.trim().split(" ");


            let initials = "";


            if (nameParts.length >= 2) {

                initials =
                    nameParts[0].charAt(0) +
                    nameParts[nameParts.length - 1].charAt(0);

            } else {

                initials =
                    nameParts[0].substring(0, 2);

            }


            document.getElementById("profileAvatar")
                .innerText =
                    initials.toUpperCase();

        }

    }



    // Dashboard

    function goToDashboard() {

        window.location.href =
            "Dashboard.html";

    }



    // Logout

    function logout() {


        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (!confirmLogout) {

            return;
        }


        // Remove current login only

        localStorage.removeItem("loggedIn");

        localStorage.removeItem("currentUser");


        // Do NOT remove accounts.
        // Registered accounts remain saved.


        window.location.href =
            "index.html";

    }



    // Load profile when page opens

    loadProfile();

</script>


</body>

</html>
