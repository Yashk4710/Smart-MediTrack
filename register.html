<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Medicine Reminder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef7ff, #f8fbff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        .title {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #777;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #0d6efd;
            color: white;
            font-weight: 600;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #0b5ed7;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            display: none;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">
        <i class="bi bi-person-plus-fill"></i>
    </div>

    <h2 class="title">Create Account</h2>

    <p class="subtitle">
        Create your Smart Medicine Reminder account
    </p>

    <div id="successMessage" class="message success-message">
        Account created successfully!
    </div>

    <div id="errorMessage" class="message error-message"></div>

    <form id="registerForm">

        <!-- Full Name -->
        <div class="mb-3">
            <label for="name" class="form-label">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Enter your full name"
                required
            >
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >
        </div>

        <!-- Phone -->
        <div class="mb-3">
            <label for="phone" class="form-label">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                class="form-control"
                placeholder="Enter your phone number"
                required
            >
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', 'passwordIcon')"
                >
                    <i id="passwordIcon" class="bi bi-eye"></i>
                </button>

            </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')"
                >
                    <i id="confirmPasswordIcon" class="bi bi-eye"></i>
                </button>

            </div>
        </div>

        <button type="submit" class="register-btn">
            <i class="bi bi-person-plus-fill me-2"></i>
            Create Account
        </button>

    </form>

    <div class="login-text">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>

    // Show / Hide Password
    function togglePassword(inputId, iconId) {

        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");

        }
    }


    // Register Account
    document.getElementById("registerForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const successMessage = document.getElementById("successMessage");
        const errorMessage = document.getElementById("errorMessage");

        successMessage.style.display = "none";
        errorMessage.style.display = "none";


        // Validate name
        if (name.length < 2) {

            errorMessage.innerText = "Please enter a valid name.";
            errorMessage.style.display = "block";
            return;
        }


        // Validate email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            errorMessage.innerText = "Please enter a valid email address.";
            errorMessage.style.display = "block";
            return;
        }


        // Validate phone
        const phonePattern = /^[0-9]{10}$/;

        if (!phonePattern.test(phone)) {

            errorMessage.innerText = "Please enter a valid 10-digit phone number.";
            errorMessage.style.display = "block";
            return;
        }


        // Validate password
        if (password.length < 6) {

            errorMessage.innerText =
                "Password must contain at least 6 characters.";

            errorMessage.style.display = "block";
            return;
        }


        // Confirm password
        if (password !== confirmPassword) {

            errorMessage.innerText =
                "Passwords do not match.";

            errorMessage.style.display = "block";
            return;
        }


        // Get existing accounts
        let accounts =
            JSON.parse(localStorage.getItem("accounts")) || [];


        // Check duplicate email
        const existingAccount = accounts.find(function(account) {

            return account.email === email;

        });


        if (existingAccount) {

            errorMessage.innerText =
                "An account with this email already exists.";

            errorMessage.style.display = "block";

            return;
        }


        // Create new account
        const newAccount = {

            name: name,

            email: email,

            phone: phone,

            password: password

        };


        // Save account
        accounts.push(newAccount);

        localStorage.setItem(
            "accounts",
            JSON.stringify(accounts)
        );


        // Show success
        successMessage.innerText =
            "Account created successfully! Redirecting to login...";

        successMessage.style.display = "block";


        // Clear form
        document.getElementById("registerForm").reset();


        // Redirect to login
        setTimeout(function() {

            window.location.href = "login.html";

        }, 1200);

    });

</script>

</body>
</html>
